log4j.rootLogger=INFO, stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n
log4j.logger.kafka=WARN
log4j.logger.org.apache.kafka=WARN
# Which principal each request ran as, and every authorization decision (POC_REPORT log excerpts).
log4j.logger.io.confluent.kafka.schemaregistry.security=DEBUG
log4j.logger.io.confluent.common.security=DEBUG
log4j.logger.io.confluent.kafka.clients.plugins.auth.jwt=DEBUG
