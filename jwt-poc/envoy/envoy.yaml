# The only way in to the bearer-token Schema Registry cluster (sr-jwt-1, sr-jwt-2 have no host ports).
# Every request is first checked by ext_authz (HTTP mode) against the auth service (Basic -> bcrypt -> JWT).
#   2xx      -> its `Authorization: Bearer <JWT>` header replaces the client's upstream (allowed_upstream_headers)
#   401/403  -> returned to the client with the auth service's headers and body; nothing goes upstream
#   auth service unreachable / timeout / 5xx -> 503 (status_on_error, failure_mode_allow false): fails closed
admin:
  address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }   # inside the container only

static_resources:
  listeners:
    - name: sr
      address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: sr
                # upstream = SR node that served it ("-" = never reached SR); auth = auth service's X-Auth-Service reason
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "ACCESS %REQ(:METHOD)% %REQ(:PATH)% status=%RESPONSE_CODE% upstream=%UPSTREAM_HOST% auth=%RESP(X-AUTH-SERVICE)% details=%RESPONSE_CODE_DETAILS%\n"
                route_config:
                  virtual_hosts:
                    - name: sr
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: schema_registry, timeout: 60s }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      status_on_error: { code: ServiceUnavailable }
                      http_service:
                        # The check request keeps the client's method and headers, no body; the path becomes /check<path>
                        server_uri: { uri: "http://auth-service:8080", cluster: auth_service, timeout: 5s }
                        path_prefix: /check
                        authorization_response:
                          # Set (not appended): replaces every Authorization header the client sent
                          allowed_upstream_headers:
                            patterns: [{ exact: authorization, ignore_case: true }]
                          allowed_client_headers_on_success:
                            patterns: [{ exact: x-auth-service, ignore_case: true }]
                          # On denial all auth service headers go to the client (WWW-Authenticate, X-Auth-Service)
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # STRICT_DNS re-resolves Docker's DNS every 5 s, so restarted containers (new IPs) are found again
    - name: auth_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 5s
      connect_timeout: 2s
      load_assignment:
        cluster_name: auth_service
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: auth-service, port_value: 8080 } } }
    # Round-robin over both nodes: writes that land on the follower are forwarded to the leader.
    - name: schema_registry
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 5s
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: schema_registry
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: sr-jwt-1, port_value: 8081 } } }
              - endpoint: { address: { socket_address: { address: sr-jwt-2, port_value: 8081 } } }
