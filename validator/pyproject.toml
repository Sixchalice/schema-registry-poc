[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-validator"
version = "0.1.0"
requires-python = ">=3.11"
# Pinned to the versions the validator was verified with: its verdicts depend on these
# libraries' exact behaviour (fastavro's errors, jsonschema's draft choice, protoc's
# messages and limits, urllib3's read1). Upgrade only after re-running the integration
# suite and the differential run.
dependencies = [
    "fastavro==1.13.1",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "grpcio-tools==1.85.1",
    "protobuf==7.36.2",
    "requests==2.34.2",
    "urllib3==2.8.0",
    # The settings class (ValidatorConfig) and what it pulls in.
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pydantic-core==2.50.2",
    "annotated-types==0.8.0",
    "python-dotenv==1.2.4",
    "typing-inspection==0.4.5",
    "typing-extensions==4.16.0",
]

[tool.setuptools.packages.find]
include = ["schema_validator*"]

[tool.setuptools.package-data]
schema_validator = ["_proto/**/*.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the Docker stack in integration/"]
