# Secured registry for the validator's auth tests: HTTP Basic auth and the Confluent
# Security Plugin in ACL mode. Its own registry cluster and topics on the test Kafka.
listeners=http://0.0.0.0:8081
host.name=schema-registry-secured
authentication.method=BASIC
authentication.realm=SchemaRegistryRealm
authentication.roles=sr-user

kafkastore.bootstrap.servers=PLAINTEXT://kafka:29092
kafkastore.topic=_schemas_secured
kafkastore.topic.replication.factor=1
schema.registry.group.id=schema-registry-secured

resource.extension.class=io.confluent.kafka.schemaregistry.security.SchemaRegistrySecurityResourceExtension
confluent.schema.registry.authorizer.class=io.confluent.kafka.schemaregistry.security.authorizer.schemaregistryacl.SchemaRegistryAclAuthorizer
confluent.schema.registry.auth.mechanism=JETTY_AUTH
confluent.schema.registry.acl.topic=_schemas_secured_acl

confluent.license.topic=_confluent-license
confluent.license.topic.replication.factor=1
