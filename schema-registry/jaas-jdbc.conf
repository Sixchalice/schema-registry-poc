// Test 8 baseline only (schema-registry-jdbc): Jetty's stock JAAS JDBCLoginModule against the same SQL Server.
// It runs two queries per login, each on a brand-new connection.
// Option names verified against org.eclipse.jetty.jaas.spi.JDBCLoginModule / AbstractDatabaseLoginModule 9.4.57.
SchemaRegistryRealm {
  org.eclipse.jetty.jaas.spi.JDBCLoginModule required
  debug="false"
  dbDriver="com.microsoft.sqlserver.jdbc.SQLServerDriver"
  // encrypt=true + trustServerCertificate=true: TLS without cert validation, POC only.
  dbUrl="jdbc:sqlserver://mssql:1433;databaseName=platform;encrypt=true;trustServerCertificate=true;loginTimeout=5;applicationName=schema-registry-jdbc"
  dbUserName="sr_jdbc"
  dbPassword="sr-jdbc-secret"
  userTable="sr_auth_users"
  userField="username"
  credentialField="password"
  userRoleTable="sr_auth_roles"
  userRoleUserField="username"
  userRoleRoleField="role";
};
