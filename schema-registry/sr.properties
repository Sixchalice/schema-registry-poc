# ---------- Listener / Jetty BASIC auth (rest-utils RestConfig) ----------
listeners=http://0.0.0.0:8081
host.name=schema-registry
authentication.method=BASIC
# Must equal the JAAS login-module entry name in jaas.conf
authentication.realm=SchemaRegistryRealm
# Every DB user gets role 'sr-user' via the sr_auth_roles view
authentication.roles=sr-user

# ---------- Storage: Kafka over SASL_PLAINTEXT / SCRAM-SHA-256 ----------
kafkastore.bootstrap.servers=SASL_PLAINTEXT://kafka:29092
kafkastore.security.protocol=SASL_PLAINTEXT
kafkastore.sasl.mechanism=SCRAM-SHA-256
kafkastore.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="schema-registry" password="schema-registry-secret";
kafkastore.topic=_schemas
kafkastore.topic.replication.factor=1
schema.registry.group.id=schema-registry

# ---------- Security plugin, ACL mode ----------
# SchemaExporterResourceExtension enables Schema Linking (exporters) on this instance.
resource.extension.class=io.confluent.kafka.schemaregistry.security.SchemaRegistrySecurityResourceExtension,io.confluent.schema.exporter.SchemaExporterResourceExtension
confluent.schema.registry.authorizer.class=io.confluent.kafka.schemaregistry.security.authorizer.schemaregistryacl.SchemaRegistryAclAuthorizer
confluent.schema.registry.auth.mechanism=JETTY_AUTH
# ACL topic defaults to <kafkastore.topic>_acl = _schemas_acl; set explicitly for clarity
confluent.schema.registry.acl.topic=_schemas_acl

# ---------- Licensing: no confluent.license => 30-day trial of the security plugin ----------
confluent.license.topic=_confluent-license
confluent.license.topic.replication.factor=1

# ---------- Schema Linking (exporters) ----------
kafkastore.update.handlers=io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler
password.encoder.secret=poc-password-encoder-secret
exporter.config.topic=_exporter_configs
exporter.state.topic=_exporter_states
# IMPORTANT: the default (false) leaves /exporters completely unauthorized under the ACL
# authorizer: any authenticated user can create/delete exporters and copy ALL schemas to an SR
# of their choice (see README, test 5). With true, exporter endpoints require EXPORTER_ACCESS,
# which the ACL authorizer grants only to principals holding every SUBJECT_* op on subject '*'.
# Test 5 temporarily overrides this back to false via SR_EXTRA_PROPS to demonstrate the issue.
schema.linking.rbac.enable=true
