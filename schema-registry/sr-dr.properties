
# ---------- DR registry overrides (appended to sr.properties for schema-registry-dr) ----------
# A separate Schema Registry cluster: own group and own topics, so it shares nothing with the
# primary except Kafka itself (in production it would run on the DR Kafka cluster).
host.name=schema-registry-dr
schema.registry.group.id=schema-registry-dr
kafkastore.topic=_schemas_dr
confluent.schema.registry.acl.topic=_schemas_dr_acl
exporter.config.topic=_exporter_dr_configs
exporter.state.topic=_exporter_dr_states
