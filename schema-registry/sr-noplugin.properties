# Benchmark twin of sr.properties: identical BASIC auth (in-memory snapshot, jaas.conf), NO security plugin, NO exporters.
# Non-leader follower in the same SR group: serves reads from the same _schemas topic.
listeners=http://0.0.0.0:8081
host.name=schema-registry-noplugin
authentication.method=BASIC
authentication.realm=SchemaRegistryRealm
authentication.roles=sr-user
kafkastore.bootstrap.servers=SASL_PLAINTEXT://kafka:29092
kafkastore.security.protocol=SASL_PLAINTEXT
kafkastore.sasl.mechanism=SCRAM-SHA-256
kafkastore.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="schema-registry" password="schema-registry-secret";
kafkastore.topic=_schemas
kafkastore.topic.replication.factor=1
schema.registry.group.id=schema-registry
leader.eligibility=false
