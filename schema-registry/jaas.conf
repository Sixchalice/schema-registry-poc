// JAAS realm (authentication.realm=SchemaRegistryRealm) for schema-registry and schema-registry-noplugin:
// the whole auth view is kept in memory (poc.auth.SnapshotLoginModule,
// source in auth/). Logins never touch the database; a background thread reloads the whole view
// every reloadSeconds. The container runs poc.auth.Preflight with this same entry first.
SchemaRegistryRealm {
  poc.auth.SnapshotLoginModule required
  // encrypt=true + trustServerCertificate=true: TLS without cert validation, POC only.
  dbUrl="jdbc:sqlserver://mssql:1433;databaseName=platform;encrypt=true;trustServerCertificate=true;loginTimeout=5;queryTimeout=10;applicationName=schema-registry"
  dbUserName="sr_auth"
  dbPassword="sr-auth-secret"
  usersQuery="SELECT username, password FROM sr_auth_users"
  role="sr-user"
  reloadSeconds="60";
};
