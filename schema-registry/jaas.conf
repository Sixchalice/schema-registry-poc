// Jetty 9.4 JAAS realm used by Schema Registry's BASIC auth (authentication.realm=SchemaRegistryRealm).
// Option names verified against org.eclipse.jetty.jaas.spi.JDBCLoginModule / AbstractDatabaseLoginModule 9.4.57.
SchemaRegistryRealm {
  org.eclipse.jetty.jaas.spi.JDBCLoginModule required
  debug="false"
  dbDriver="org.postgresql.Driver"
  dbUrl="jdbc:postgresql://postgres:5432/platform?ApplicationName=schema-registry-jaas"
  dbUserName="sr_auth"
  dbPassword="sr-auth-secret"
  userTable="sr_auth_users"
  userField="username"
  credentialField="password"
  userRoleTable="sr_auth_roles"
  userRoleUserField="username"
  userRoleRoleField="role";
};
