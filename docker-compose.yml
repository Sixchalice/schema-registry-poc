name: sr-acl-poc

# Local POC: Confluent Schema Registry 7.9 + Security Plugin (ACL mode) with HTTP Basic auth
# checked against an in-memory snapshot of SQL Server (poc.auth.SnapshotLoginModule, see auth/).

x-sr-common: &sr-common
  build: ./schema-registry
  image: sr-acl-poc/schema-registry:7.9.0
  depends_on:
    kafka: { condition: service_healthy }
    mssql: { condition: service_healthy }
  volumes:
    - ./schema-registry:/etc/schema-registry/poc:ro
    - ./auth/target:/opt/poc-auth:ro   # sr-auth-snapshot.jar, built by up.sh
  entrypoint: ["bash", "-c"]

# Snapshot login module on the classpath (schema-registry-run-class appends to CLASSPATH) + realm.
x-sr-env: &sr-env
  CLASSPATH: /opt/poc-auth/sr-auth-snapshot.jar
  SCHEMA_REGISTRY_OPTS: "-Djava.security.auth.login.config=/etc/schema-registry/poc/jaas.conf"
  SCHEMA_REGISTRY_LOG4J_OPTS: "-Dlog4j.configuration=file:/etc/schema-registry/poc/log4j.properties"

services:
  kafka:
    image: confluentinc/cp-server:7.9.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # CONTROLLER is PLAINTEXT but bound to localhost inside the container only.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-256
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/poc/kafka_server_jaas.conf"
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: "User:broker;User:ANONYMOUS"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # cp-server internal topics on a single broker
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_ENABLE: "false"
      KAFKA_CONFLUENT_DURABILITY_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_TIER_METADATA_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_REPORTERS_TELEMETRY_AUTO_ENABLE: "false"
      KAFKA_CONFLUENT_TELEMETRY_ENABLED: "false"
    volumes:
      - ./kafka:/etc/kafka/poc:ro
    # Same as the image's /etc/confluent/docker/run, except the KRaft format step
    # also bootstraps the SCRAM credential of the inter-broker user (KIP-900).
    command:
      - bash
      - -c
      - |
        . /etc/confluent/docker/bash-config
        /etc/confluent/docker/configure
        kafka-storage format --ignore-formatted --cluster-id="$$CLUSTER_ID" -c /etc/kafka/kafka.properties \
          --add-scram 'SCRAM-SHA-256=[name=broker,password=broker-secret]'
        exec /etc/confluent/docker/launch
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 --command-config /etc/kafka/poc/admin.properties >/dev/null 2>&1"]
      interval: 5s
      timeout: 20s
      retries: 30

  # The platform database. x86-only image: runs under Rosetta on Apple Silicon.
  # No host port: scripts use `docker compose exec mssql sqlcmd`. Schema: mssql/init.sql (run by up.sh).
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    platform: linux/amd64
    hostname: mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Platform-secret1
    volumes:
      - ./mssql:/etc/mssql-poc:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b >/dev/null"]
      interval: 3s
      timeout: 10s
      retries: 40

  # Concatenates the base properties with optional extra lines (SR_EXTRA_PROPS, ';'-separated) so
  # tests can flip a single setting without editing files. The preflight loads the user snapshot
  # once before Schema Registry starts; if SQL Server is down the container exits instead.
  schema-registry:
    <<: *sr-common
    hostname: schema-registry
    ports:
      - "8081:8081"
    environment:
      <<: *sr-env
      SR_BASE_PROPS: /etc/schema-registry/poc/sr.properties
      SR_EXTRA_PROPS: ${SR_EXTRA_PROPS:-}
    command:
      - |
        cp "$$SR_BASE_PROPS" /tmp/sr.properties
        [ -n "$$SR_EXTRA_PROPS" ] && echo "$$SR_EXTRA_PROPS" | tr ';' '\n' >> /tmp/sr.properties
        echo "===> effective extra props: $${SR_EXTRA_PROPS:-<none>}"
        java -cp "/opt/poc-auth/*:/usr/share/java/rest-utils/*:/usr/share/java/schema-registry/*" \
          $$SCHEMA_REGISTRY_OPTS poc.auth.Preflight SchemaRegistryRealm || exit 1
        exec schema-registry-start /tmp/sr.properties

  # Benchmark-only (test 8): same auth (snapshot), security plugin OFF. Joins the same
  # SR group as a non-leader follower and serves reads from the same _schemas topic.
  schema-registry-noplugin:
    <<: *sr-common
    profiles: ["bench"]
    hostname: schema-registry-noplugin
    ports:
      - "8082:8081"
    environment:
      <<: *sr-env
    command:
      - |
        cp /etc/schema-registry/poc/sr-noplugin.properties /tmp/sr.properties
        java -cp "/opt/poc-auth/*:/usr/share/java/rest-utils/*:/usr/share/java/schema-registry/*" \
          $$SCHEMA_REGISTRY_OPTS poc.auth.Preflight SchemaRegistryRealm || exit 1
        exec schema-registry-start /tmp/sr.properties

  # Benchmark-only (test 8 baseline): same config as schema-registry (plugin ON, same ACLs), but login
  # via Jetty's stock JDBCLoginModule against the same SQL Server (jaas-jdbc.conf). Non-leader.
  schema-registry-jdbc:
    <<: *sr-common
    profiles: ["bench"]
    hostname: schema-registry-jdbc
    ports:
      - "8083:8081"
    environment:
      SCHEMA_REGISTRY_OPTS: "-Djava.security.auth.login.config=/etc/schema-registry/poc/jaas-jdbc.conf"
      SCHEMA_REGISTRY_LOG4J_OPTS: "-Dlog4j.configuration=file:/etc/schema-registry/poc/log4j.properties"
    command:
      - |
        cp /etc/schema-registry/poc/sr.properties /tmp/sr.properties
        printf '\nhost.name=schema-registry-jdbc\nleader.eligibility=false\n' >> /tmp/sr.properties
        exec schema-registry-start /tmp/sr.properties

  # Java Avro producer/consumer (see client/). Built and run via scripts/test.sh.
  client:
    image: maven:3.9.9-eclipse-temurin-17
    profiles: ["client"]
    working_dir: /src
    volumes:
      - ./client:/src
      - ./.cache/m2:/root/.m2
    entrypoint: ["java", "-jar", "/src/target/client.jar"]

